<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>在りし日の唄</title>
  <style>
    :root { color-scheme: dark; --paper:#f4eee5; --ink:#25272b; --muted:#b9b6b2; --accent:#d9c7a3; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: "Yu Gothic", "Meiryo", sans-serif;
      color: var(--paper);
      background: radial-gradient(circle at 50% 15%, #54504c 0, #27292d 42%, #17191d 100%);
    }
    .player { width: min(100%, 370px); padding: 18px; border-radius: 26px; background: rgba(245,240,232,.12); border: 1px solid rgba(255,255,255,.16); box-shadow: 0 24px 70px #0008; }
    .topline { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:12px; letter-spacing:.12em; margin-bottom:16px; }
    .cover { aspect-ratio: 1 / 1; display:grid; place-items:center; overflow:hidden; border:1px solid #e6d8c4; background: linear-gradient(145deg,#e9d3b4,#b3a08d 50%,#5a5b57); color:#292929; }
    .cover img { width:100%; height:100%; object-fit:cover; display:block; }
    .cover-placeholder { text-align:center; padding:20px; }
    .cover-placeholder .seal { font-family:serif; font-size:42px; border:1px solid currentColor; border-radius:50%; width:78px;height:78px;display:grid;place-items:center;margin:0 auto 14px; }
    .cover-placeholder p { margin:0; font-family:serif; letter-spacing:.2em; }
    .track { padding:22px 2px 12px; }
    .track h1 { font-size:21px; margin:0 0 7px; font-weight:700; }
    .track p { margin:0; font-size:12px; color:var(--muted); }
    .progress-wrap { margin:18px 0 7px; }
    input[type=range] { width:100%; accent-color:var(--accent); cursor:pointer; }
    .times { display:flex; justify-content:space-between; color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; }
    .controls { display:flex; justify-content:center; align-items:center; gap:28px; padding:20px 0 12px; }
    button { border:0; cursor:pointer; color:var(--paper); background:transparent; font-size:23px; padding:8px; }
    button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
    .play { width:62px;height:62px;border-radius:50%;background:var(--paper);color:var(--ink);font-size:24px;box-shadow:0 5px 18px #0004; }
    .hint { text-align:center; color:var(--muted); font-size:11px; line-height:1.7; margin:12px 4px 2px; }
    audio { display:none; }
  </style>
</head>
<body>
  <main class="player">
    <div class="topline"><span>音楽プレーヤー</span><span>01 / 01</span></div>
  <div class="cover" id="cover">
  <img src="assets/cover.jpg" alt="在りし日の唄のジャケット">
</div>
    <section class="track">
      <h1>在りし日の唄</h1>
      <p>8bit風アレンジ</p>
      <div class="progress-wrap">
        <input id="seek" type="range" min="0" max="100" value="0" aria-label="再生位置">
        <div class="times"><span id="current">0:00</span><span id="duration">0:00</span></div>
      </div>
    </section>
    <div class="controls">
      <button id="prev" aria-label="前の曲" title="前の曲">|◀</button>
      <button class="play" id="play" aria-label="再生" title="再生">▶</button>
      <button id="next" aria-label="次の曲" title="次の曲">▶|</button>
    </div>
    <p class="hint" id="hint">音源を追加すると、ここで再生できます。<br>まずは assets/song.m4a を用意してください。</p>
    <audio id="audio" preload="metadata" src="assets/song.m4a"></audio>
  </main>
<script>
const audio = document.getElementById('audio');
const play = document.getElementById('play');
const seek = document.getElementById('seek');
const current = document.getElementById('current');
const duration = document.getElementById('duration');
const hint = document.getElementById('hint');
const fmt = n => Number.isFinite(n) ? `${Math.floor(n/60)}:${String(Math.floor(n%60)).padStart(2,'0')}` : '0:00';

audio.addEventListener('loadedmetadata', () => {
  duration.textContent = fmt(audio.duration);
  hint.textContent = '再生ボタンで音楽を再生できます。';
});
audio.addEventListener('timeupdate', () => {
  current.textContent = fmt(audio.currentTime);
  if (Number.isFinite(audio.duration) && audio.duration > 0) seek.value = audio.currentTime / audio.duration * 100;
});
audio.addEventListener('play', () => { play.textContent = 'Ⅱ'; play.setAttribute('aria-label','一時停止'); });
audio.addEventListener('pause', () => { play.textContent = '▶'; play.setAttribute('aria-label','再生'); });
audio.addEventListener('ended', () => { play.textContent = '▶'; });
play.addEventListener('click', async () => {
  if (!audio.querySelector('source') && audio.error) {
    hint.textContent = '音源ファイルがまだありません。assets/song.m4a に音源を追加してください。';
    return;
  }
  if (audio.paused) {
    try { await audio.play(); }
    catch { hint.textContent = '音源が見つからないか、再生できません。assets/song.m4a を確認してください。'; }
  } else audio.pause();
});
seek.addEventListener('input', () => {
  if (Number.isFinite(audio.duration) && audio.duration > 0) audio.currentTime = seek.value / 100 * audio.duration;
});
document.getElementById('prev').addEventListener('click', () => { audio.currentTime = 0; });
document.getElementById('next').addEventListener('click', () => { audio.currentTime = 0; });
audio.addEventListener('error', () => { hint.textContent = '音源ファイルが未設定です。assets/song.m4a に音源を入れると再生できます。'; });
</script>
</body>
</html>
